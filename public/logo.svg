<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="#818cf8" stroke-width="6" stroke-opacity="0.35" />
  
  <!-- Candlesticks background accent -->
  <line x1="140" y1="220" x2="140" y2="380" stroke="#10b981" stroke-width="6" opacity="0.25" />
  <rect x="130" y="250" width="20" height="100" rx="4" fill="#10b981" opacity="0.3" />

  <line x1="240" y1="160" x2="240" y2="350" stroke="#10b981" stroke-width="6" opacity="0.3" />
  <rect x="230" y="190" width="20" height="130" rx="4" fill="#10b981" opacity="0.35" />

  <line x1="340" y1="110" x2="340" y2="300" stroke="#10b981" stroke-width="6" opacity="0.4" />
  <rect x="330" y="140" width="20" height="130" rx="4" fill="#10b981" opacity="0.45" />

  <!-- Main Rising Chart Line -->
  <path d="M 80 380 L 170 310 L 250 340 L 360 200 L 430 120" fill="none" stroke="url(#lineGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Ascending Arrow Head -->
  <path d="M 350 120 L 430 120 L 430 200" fill="none" stroke="#10b981" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Peak Node -->
  <circle cx="430" cy="120" r="22" fill="#10b981" filter="url(#glow)" />
  <circle cx="430" cy="120" r="10" fill="#ffffff" />
</svg>
